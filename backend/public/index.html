<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Todo — Get it done</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EFEDE7;
    --ink: #1B2430;
    --ink-soft: #5B6472;
    --teal: #3E7C8C;
    --coral: #E4572E;
    --line: #D8D4C9;
    --surface: #FBFAF7;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    height: 100%;
    overflow-x: hidden;
  }

  canvas#bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }

  main {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px;
    text-align: center;
  }

  .card {
    background: rgba(251, 250, 247, 0.86);
    backdrop-filter: blur(6px);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 48px 44px;
    max-width: 520px;
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--teal);
    margin-bottom: 18px;
  }

  h1 {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: clamp(32px, 5vw, 46px);
    line-height: 1.15;
    margin: 0 0 18px 0;
    letter-spacing: -0.01em;
  }

  h1 .strike {
    position: relative;
    color: var(--ink-soft);
  }

  h1 .strike::after {
    content: "";
    position: absolute;
    left: -2%;
    right: -2%;
    top: 52%;
    height: 3px;
    background: var(--coral);
    transform: scaleX(0);
    transform-origin: left;
    animation: strike-in 0.6s ease-out 1.1s forwards;
  }

  @keyframes strike-in {
    to { transform: scaleX(1); }
  }

  p.sub {
    font-size: 15px;
    color: var(--ink-soft);
    line-height: 1.6;
    margin: 0 0 32px 0;
  }

  .actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    padding: 12px 26px;
    border-radius: 4px;
    text-decoration: none;
    cursor: pointer;
    border: 1.5px solid transparent;
    transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    display: inline-block;
  }

  .btn:hover { transform: translateY(-1px); }
  .btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

  .btn-primary {
    background: var(--ink);
    color: var(--bg);
  }
  .btn-primary:hover { background: var(--teal); }

  .btn-secondary {
    background: transparent;
    color: var(--ink);
    border-color: var(--line);
  }
  .btn-secondary:hover { border-color: var(--teal); color: var(--teal); }

  .foot-note {
    margin-top: 28px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    opacity: 0.7;
  }

  @media (prefers-reduced-motion: reduce) {
    h1 .strike::after { animation: none; transform: scaleX(1); }
  }
</style>
</head>
<body>

<canvas id="bg"></canvas>

<main>
  <div class="card">
    <div class="eyebrow">Todo · Task Tracker</div>
    <h1>Get it <span class="strike">figured out</span><br/>done.</h1>
    <p class="sub">A small, no-nonsense place to keep your tasks. Sign in to pick up where you left off, or create an account to start your first list.</p>
    <div class="actions">
      <a class="btn btn-primary" href="login.html">Log In</a>
      <a class="btn btn-secondary" href="signup.html">Sign Up</a>
    </div>
    <div class="foot-note">built from scratch — express · mongodb · jwt</div>
  </div>
</main>

<script>
  const canvas = document.getElementById('bg');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    buildGrid();
  }

  const CELL = 64;
  const PAD = 20;
  let cells = [];

  function buildGrid() {
    cells = [];
    const cols = Math.ceil(W / CELL) + 1;
    const rows = Math.ceil(H / CELL) + 1;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        cells.push({
          x: c * CELL + PAD,
          y: r * CELL + PAD,
          size: 14,
          // stagger each cell's animation cycle so the wave feels organic
          phase: Math.random() * Math.PI * 2,
          speed: 0.006 + Math.random() * 0.002
        });
      }
    }
  }

  function drawCheckbox(cell, t) {
    // progress cycles 0 -> 1 -> 0: empty -> checked -> empty
    const raw = (Math.sin(t * cell.speed + cell.phase) + 1) / 2; // 0..1
    const progress = Math.max(0, (raw - 0.65) / 0.35); // only "checked" near the peak
    const boxAlpha = 0.10 + 0.05 * (1 - progress);

    ctx.strokeStyle = `rgba(27, 36, 48, ${boxAlpha})`;
    ctx.lineWidth = 1.4;
    ctx.strokeRect(cell.x, cell.y, cell.size, cell.size);

    if (progress > 0.02) {
      ctx.strokeStyle = `rgba(228, 87, 46, ${Math.min(progress, 1) * 0.55})`;
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      const x = cell.x, y = cell.y, s = cell.size;
      // simple checkmark, drawn proportionally to progress
      const p = Math.min(progress * 1.4, 1);
      ctx.moveTo(x + s * 0.2, y + s * 0.55);
      ctx.lineTo(x + s * 0.2 + (s * 0.22) * Math.min(p * 2, 1), y + s * 0.55 + (s * 0.22) * Math.min(p * 2, 1));
      if (p > 0.5) {
        const p2 = (p - 0.5) * 2;
        ctx.lineTo(x + s * 0.42 + (s * 0.4) * p2, y + s * 0.77 - (s * 0.55) * p2);
      }
      ctx.stroke();
    }
  }

  function loop(t) {
    ctx.clearRect(0, 0, W, H);
    for (const cell of cells) drawCheckbox(cell, t);
    requestAnimationFrame(loop);
  }

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  window.addEventListener('resize', resize);
  resize();

  if (reduceMotion) {
    // draw a single static frame instead of animating
    for (const cell of cells) drawCheckbox(cell, 0);
  } else {
    requestAnimationFrame(loop);
  }
</script>

</body>
</html>
