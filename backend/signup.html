<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — Todo App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Sign Up</h1>
    <form id="signup-form">
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Sign Up</button>
      <p class="error-msg" id="error-msg"></p>
    </form>
    <p class="switch-link">Already have an account? <a href="login.html">Log in</a></p>
  </div>

  <!-- CHANGE 1: deleted <script src="config.js"></script> -->

  <!-- CHANGE 2: type="module" -->
  <script type="module">
    <!-- CHANGE 3: two imports, same idea as login.html but createUserWithEmailAndPassword instead -->
    import { auth } from "./firebase-config.js";
    import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";

    const form = document.getElementById("signup-form");
    const errorMsg = document.getElementById("error-msg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMsg.textContent = "";

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        // CHANGE 4: fetch() block replaced with one line
        await createUserWithEmailAndPassword(auth, email, password);

        // CHANGE 5 — this one's different from login.html, read the note below
        window.location.href = "todos.html";
      } catch (err) {
        errorMsg.textContent = err.message;
      }
    });
  </script>
</body>
</html>
